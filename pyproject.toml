[project]
name = "capswriter-offline"
version = "2.9.5"
description = "CapsWriter-Offline 离线语音输入工具"
requires-python = ">=3.14"

dependencies = [
    # ASR 核心
    "sherpa-onnx",
    "numpy",
    "gguf",
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio[stt]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece",
    "soundfile",
    "numba",

    # 网络与 API
    "websockets",
    "openai",
    "ollama",
    "httpx",
    "requests",

    # CLI 与界面
    "rich",
    "typer",
    "colorama",
    "markdown",
    "markdown-it-py",
    "tkhtmlview",

    # 输入与硬件
    "keyboard; sys_platform == 'win32'",
    "pynput",
    "pyclip",
    "sounddevice",
    "watchdog",
    "pystray",
    "Pillow",

    # 数据处理
    "pypinyin",
    "srt",
    "rapidfuzz",
    "pydub",

    # 对齐器分词（日/韩）
    "nagisa",
    "soynlp",

    # Windows
    "pywin32; sys_platform == 'win32'",
    "psutil",
]

[dependency-groups]
build = [
    "pyinstaller",
]
